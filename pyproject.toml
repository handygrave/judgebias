[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "handygrave-judgebias"
version = "0.1.0"
description = "统计裁判选择与答案长度、出现顺序的相关性，给出偏差强度"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "handygrave" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://handygrave.github.io"
Repository = "https://github.com/handygrave/judgebias"
Issues = "https://github.com/handygrave/judgebias/issues"

[project.scripts]
judgebias = "judgebias:main"

[tool.setuptools]
py-modules = ["judgebias"]
